name: JChatControl
version: '${project.version}'
main: dev.jkaanof.jchatcontrol.bukkit.JChatControl
api-version: '1.21'
author: JKaanOF
authors: [JKaanOF]
description: AI-assisted chat moderation (profanity, racism, religion, language, politics) with minimal API usage.
website: https://github.com/JKaan1/JChatControl

commands:
  jchatcontrol:
    description: JChatControl admin command
    usage: /<command> help
    aliases: [jcc, chatcontrol]
  chattest:
    description: Test a message against the chat filter (local filters + AI)
    usage: /<command> [-l] <message>
    aliases: [ctest, jcctest]

permissions:
  jchatcontrol.*:
    description: All JChatControl permissions
    default: op
    children:
      jchatcontrol.admin: true
      jchatcontrol.test: true
      jchatcontrol.notify: true
  jchatcontrol.admin:
    description: Use /jcc commands
    default: op
    children:
      jchatcontrol.test: true
  jchatcontrol.test:
    description: Use /chattest to test messages against the filter
    default: op
  jchatcontrol.notify:
    description: Receive staff alerts about violations
    default: op
  jchatcontrol.bypass:
    description: Messages are never checked
    default: false
  jchatcontrol.bypass.ai:
    description: Only local filters (word lists / regex) are used for this player, never the AI
    default: false
