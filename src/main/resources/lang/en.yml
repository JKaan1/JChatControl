# JChatControl - English messages. Colors: &a &c ... and &#RRGGBB
prefix: '&8[&bJChat&3Control&8] '

blocked: '{prefix}&cYour message was not sent: it contains &f{category}&c.'
censored: '{prefix}&eInappropriate words in your message were censored ({category}&e).'
warned: '{prefix}&ePlease follow the chat rules! &7({category}&7)'
late-violation: '{prefix}&cYour last message broke the rules: &f{category}&c. Violation points added.'
unverified: '{prefix}&cYour message could not be verified right now, please try again shortly.'
category-unverified: 'Unverified'
muted: '{prefix}&cYou are muted! &7Remaining: &f{time} &8| &7Reason: &f{reason}'
you-were-muted: '{prefix}&cYou have been muted. &7Duration: &f{time} &8| &7Reason: &f{reason}'
you-were-unmuted: '{prefix}&aYou are no longer muted.'
default-mute-reason: 'Breaking the chat rules'

staff-alert: '&8[&cJCC&8] &f{player} &8» &7{category} &8[&7{context}/{source}/{action}&8] &7{message} &8({detail})'

no-permission: '{prefix}&cYou do not have permission.'
unknown-command: '{prefix}&cUnknown sub command. &7/jcc help'
usage: '{prefix}&eUsage: &f{usage}'
reloaded: '{prefix}&aReloaded &7({ms} ms).'
reload-failed: '{prefix}&cReload failed! Check the console. Old settings stay active.'
saved: '{prefix}&aSaving data.'
word-allowed: '{prefix}&a"{word}" added to allowed words.'
word-unallowed: '{prefix}&a"{word}" removed from allowed words.'
word-blocked: '{prefix}&a"{word}" added to blocked words &7({category}).'
word-unblocked: '{prefix}&a"{word}" removed from blocked words.'
word-not-found: '{prefix}&c"{word}" not found.'
unknown-category: '{prefix}&cUnknown category: {category}. &7Available: {categories}'
cache-cleared: '{prefix}&aAI cache cleared &7({count} entries).'
cache-info: '{prefix}&7The AI cache holds &f{count} &7decisions. &8(/jcc cache clear)'
ai-enabled: '{prefix}&aAI checks enabled.'
ai-disabled: '{prefix}&eAI checks disabled (local filters only). Reload restores the config value.'
ai-status: '{prefix}&7AI: &f{state} &8| &7trigger: &f{trigger} &8| &7mode: &f{mode} &8| &7in flight: &f{inflight}'
muted-player: '{prefix}&a{player} muted. &7Duration: &f{time} &8| &7Reason: &f{reason}'
unmuted: '{prefix}&a{player} can talk again.'
not-muted: '{prefix}&c{player} is not muted.'
player-not-found: '{prefix}&cPlayer not found: {player}'
invalid-duration: '{prefix}&cInvalid duration: {value} &7(e.g. 30s, 10m, 2h, 1d, perm)'
violations-info: '{prefix}&f{player} &7active violation points: &c{points}'
violations-reset: '{prefix}&aViolation points of {player} reset.'

learn-header: '{prefix}&7Words waiting for approval (&f{count}&7):'
learn-line: '&8 - &f{word} &7({category})'
learn-approved: '{prefix}&a"{word}" approved and blocked.'
learn-approved-all: '{prefix}&a{count} words approved.'
learn-denied: '{prefix}&e"{word}" denied.'

test-normalized: '{prefix}&7Normalized: &f{text}'
test-waiting: '{prefix}&7Asking the AI...'
test-clean: '{prefix}&aCLEAN &8| &7stage: &f{source} &8| &7detail: &f{detail}'
test-flagged: '{prefix}&cVIOLATION &8| &7stage: &f{source} &8| &7category: &f{categories} &8| &7words: &f{words} &8| &7confidence: &f{confidence} &8| &7action: &f{action} &8| &7censored: &f{censored} &8| &7detail: &f{detail}'

test-no-commands: '{prefix}&7No commands would run for this violation.'
test-commands-header: '{prefix}&7Commands that would run on a real violation (&f{count}&7):'
test-command-line: '&8 » &e/{command}'
simulate-result: '{prefix}&7Simulation &f{player}&7: result &f{result} &8| &7stage: &f{source} &8| &7category: &f{categories}'

stats-header: '{prefix}&bStatistics'
stats-line: '&8 » &7{key}: &f{value}'

help:
  - '&8&m------&r &bJChatControl &7by JKaanOF &8&m------'
  - '&b/jcc test [-l] <message> &8- &7Test a message: stage, category, commands that would run (-l: local only)'
  - '&b/chattest [-l] <message> &8- &7Short test command (permission: jchatcontrol.test)'
  - '&b/jcc simulate <player> <message> &8- &7Apply as if the player wrote it (commands REALLY run)'
  - '&b/jcc stats &8- &7Statistics, API savings, provider status'
  - '&b/jcc allow|unallow <word> &8- &7Add/remove an allowed word'
  - '&b/jcc block <word> [category] &8- &7Block a word'
  - '&b/jcc unblock <word> &8- &7Unblock a word'
  - '&b/jcc learn [list|approve|deny|approveall] &8- &7Words suggested by the AI'
  - '&b/jcc ai [status|on|off] &8- &7AI checks'
  - '&b/jcc cache [clear] &8- &7AI decision cache'
  - '&b/jcc mute <player> <time> [reason] &8- &7Mute (30s, 10m, 2h, 1d, perm)'
  - '&b/jcc unmute <player> &8- &7Unmute'
  - '&b/jcc violations <player> [reset] &8- &7Violation points'
  - '&b/jcc reload &8| &b/jcc save'
