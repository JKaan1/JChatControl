# JChatControl - Türkçe mesajlar. Renk: &a &c ... ve &#RRGGBB
prefix: '&8[&bJChat&3Control&8] '

blocked: '{prefix}&cMesajın gönderilmedi: &f{category} &ciçeriyor.'
censored: '{prefix}&eMesajındaki uygunsuz kelimeler sansürlendi ({category}&e).'
warned: '{prefix}&eLütfen sohbet kurallarına uy! &7({category}&7)'
late-violation: '{prefix}&cSon mesajın kurallara aykırı bulundu: &f{category}&c. İhlal puanı eklendi.'
unverified: '{prefix}&cMesajın şu an doğrulanamadı, lütfen biraz sonra tekrar dene.'
category-unverified: 'Doğrulanamadı'
muted: '{prefix}&cSusturuldun! &7Kalan süre: &f{time} &8| &7Sebep: &f{reason}'
you-were-muted: '{prefix}&cSusturuldun. &7Süre: &f{time} &8| &7Sebep: &f{reason}'
you-were-unmuted: '{prefix}&aSusturman kaldırıldı.'
default-mute-reason: 'Sohbet kurallarını ihlal'

staff-alert: '&8[&cJCC&8] &f{player} &8» &7{category} &8[&7{context}/{source}/{action}&8] &7{message} &8({detail})'

no-permission: '{prefix}&cBunun için yetkin yok.'
unknown-command: '{prefix}&cBilinmeyen alt komut. &7/jcc help'
usage: '{prefix}&eKullanım: &f{usage}'
reloaded: '{prefix}&aYeniden yüklendi &7({ms} ms).'
reload-failed: '{prefix}&cYükleme hatası! Konsolu kontrol et. Eski ayarlar aktif.'
saved: '{prefix}&aVeriler kaydediliyor.'
word-allowed: '{prefix}&a"{word}" izinli kelimelere eklendi.'
word-unallowed: '{prefix}&a"{word}" izinli kelimelerden çıkarıldı.'
word-blocked: '{prefix}&a"{word}" yasaklı kelimelere eklendi &7({category}).'
word-unblocked: '{prefix}&a"{word}" yasaklı kelimelerden çıkarıldı.'
word-not-found: '{prefix}&c"{word}" bulunamadı.'
unknown-category: '{prefix}&cBilinmeyen kategori: {category}. &7Mevcut: {categories}'
cache-cleared: '{prefix}&aAI önbelleği temizlendi &7({count} kayıt).'
cache-info: '{prefix}&7AI önbelleğinde &f{count} &7karar var. &8(/jcc cache clear)'
ai-enabled: '{prefix}&aYapay zeka kontrolü açıldı.'
ai-disabled: '{prefix}&eYapay zeka kontrolü kapatıldı (sadece yerel filtreler). Reload ile config değerine döner.'
ai-status: '{prefix}&7AI: &f{state} &8| &7tetik: &f{trigger} &8| &7mod: &f{mode} &8| &7bekleyen: &f{inflight}'
muted-player: '{prefix}&a{player} susturuldu. &7Süre: &f{time} &8| &7Sebep: &f{reason}'
unmuted: '{prefix}&a{player} artık konuşabilir.'
not-muted: '{prefix}&c{player} susturulmamış.'
player-not-found: '{prefix}&cOyuncu bulunamadı: {player}'
invalid-duration: '{prefix}&cGeçersiz süre: {value} &7(örn: 30s, 10m, 2h, 1d, perm)'
violations-info: '{prefix}&f{player} &7aktif ihlal puanı: &c{points}'
violations-reset: '{prefix}&a{player} için ihlal puanları sıfırlandı.'

learn-header: '{prefix}&7Onay bekleyen kelimeler (&f{count}&7):'
learn-line: '&8 - &f{word} &7({category})'
learn-approved: '{prefix}&a"{word}" onaylandı ve yasaklı listeye eklendi.'
learn-approved-all: '{prefix}&a{count} kelime onaylandı.'
learn-denied: '{prefix}&e"{word}" reddedildi.'

test-normalized: '{prefix}&7Normalize: &f{text}'
test-waiting: '{prefix}&7Yapay zekaya soruluyor...'
test-clean: '{prefix}&aTEMİZ &8| &7aşama: &f{source} &8| &7detay: &f{detail}'
test-flagged: '{prefix}&cİHLAL &8| &7aşama: &f{source} &8| &7kategori: &f{categories} &8| &7kelimeler: &f{words} &8| &7güven: &f{confidence} &8| &7işlem: &f{action} &8| &7sansürlü: &f{censored} &8| &7detay: &f{detail}'

stats-header: '{prefix}&bİstatistikler'
stats-line: '&8 » &7{key}: &f{value}'

help:
  - '&8&m------&r &bJChatControl &7by JKaanOF &8&m------'
  - '&b/jcc test <mesaj> &8- &7Mesajı test et (hangi aşamada karar verildiğini gösterir)'
  - '&b/jcc stats &8- &7İstatistikler, API tasarrufu, sağlayıcı durumu'
  - '&b/jcc allow|unallow <kelime> &8- &7İzinli kelime ekle/çıkar'
  - '&b/jcc block <kelime> [kategori] &8- &7Yasaklı kelime ekle'
  - '&b/jcc unblock <kelime> &8- &7Yasaklı kelimeyi çıkar'
  - '&b/jcc learn [list|approve|deny|approveall] &8- &7AI tarafından önerilen kelimeler'
  - '&b/jcc ai [status|on|off] &8- &7Yapay zeka kontrolü'
  - '&b/jcc cache [clear] &8- &7AI karar önbelleği'
  - '&b/jcc mute <oyuncu> <süre> [sebep] &8- &7Sustur (30s, 10m, 2h, 1d, perm)'
  - '&b/jcc unmute <oyuncu> &8- &7Susturmayı kaldır'
  - '&b/jcc violations <oyuncu> [reset] &8- &7İhlal puanları'
  - '&b/jcc reload &8| &b/jcc save'
