help:
  - '&8&m------&r &bJChatControl &7by JKaanOF &8&m------'
  - '&b/jcc test [-l] <mesaj> &8- &7Mesajı test et: aşama, kategori, çalışacak komutlar (-l: sadece yerel)'
  - '&b/chattest [-l] <mesaj> &8- &7Kısa test komutu (yetki: jchatcontrol.test)'
  - '&b/jcc simulate <oyuncu> <mesaj> &8- &7Oyuncu yazmış gibi uygula (komutlar GERÇEKTEN çalışır)'
  - '&b/jcc stats &8- &7İstatistikler, API tasarrufu, sağlayıcı durumu'
  - '&b/jcc allow|unallow <kelime> &8- &7İzinli kelime ekle/çıkar'
  - '&b/jcc block <kelime> [kategori] &8- &7Yasaklı kelime ekle'
  - '&b/jcc unblock <kelime> &8- &7Yasaklı kelimeyi çıkar'
  - '&b/jcc learn [list|approve|deny|approveall] &8- &7AI tarafından önerilen kelimeler'
  - '&b/jcc ai [status|on|off] &8- &7Yapay zeka kontrolü'
  - '&b/jcc cache [clear] &8- &7AI karar önbelleği'
  - '&b/jcc discord [status|test] &8- &7Discord webhook durumu / test mesajı'
  - '&b/jcc mute <oyuncu> <süre> [sebep] &8- &7Sustur (30s, 10m, 2h, 1d, perm)'
  - '&b/jcc unmute <oyuncu> &8- &7Susturmayı kaldır'
  - '&b/jcc violations <oyuncu> [reset] &8- &7İhlal puanları'
  - '&b/jcc reload &8| &b/jcc save'
