punishments:
  enabled: true
  # İhlal puanları bu kadar dakika sonra silinir
  decay-minutes: 30
  # Puan eşiği: konsoldan çalıştırılacak komutlar (violation-commands'tan SONRA çalışır).
  # Yer tutucular violation-commands ile aynı.
  # Dahili susturma: jcc mute <oyuncu> <süre> [sebep]  (başka bir ceza plugini de kullanabilirsin)
